<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Upcoming</title>
</head>

<body>
    <header>
        <div class="collapsible-menu">
            <input type="checkbox" id="menu">
            <label for="menu">☰</label>
            <div class="menu-content">
                <ul class="menu-items">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="harryCharacters.html">Personnages</a></li>
                    <li><a href="harryBooks.html">Livres</a></li>
                    <li><a href="harryUpcoming.html">À venir</a></li>
                </ul>
            </div>
            <img id="harrypotterImg"
                src="https://www.harrypotter.com/_next/static/images/logo-gold-600-7a7e89b6db1ffeaab025f2091d21b645.png"
                alt="">
            <button id="muteButton">🔊</button>
        </div>
        <div class="backgroundAudio">
            <audio class="audioPlayerAudio" autoplay controls>
                <source
                    src="music/Hogwarts Legacy Official Soundtrack Miriam’s Memory - chuck e. myers “sea” WaterTower Music - WaterTower Music (192k).mp3">
            </audio>
        </div>
    </header>

    <div id="contactPageTopImage">
        <h1 id="contactTitle">Abonne-toi et crée un compte pour les dernières nouvelles du monde de Harry Potter</h1>
        <p id="contactDescription">Veuillez remplir le formulaire suivant si'il vous plait!</p>
    </div>
    <div id="contactPageTopImageFade"></div>

    <section class="contactContainer">
        <div class="contactBlock">
            <div class="contactForms">
                <form id="contactForm">
                    <div class="formName">
                        <label for="formName">Nom:</label>
                        <input type="text" id="formName" name="formName" placeholder="Joe Swanson">
                        <span class="error-message" id="formNameError"></span>
                    </div>
                    <br>
                    <div class="formEmail">
                        <label for="formEmail">Courielle:</label>
                        <input type="email" id="formEmail" name="formEmail" placeholder="...@gmail.com">
                        <span class="error-message" id="formEmailError"></span>
                    </div>
                    <br>
                    <div class="formPhoneNumber">
                        <label for="formPhoneNumber">Cellulaire:</label>
                        <input type="tel" id="formPhoneNumber" name="formPhoneNumber" placeholder="optional">
                        <span class="error-message" id="formPhoneNumberError"></span>
                    </div>
                    <br>
                    <div class="formPassword">
                        <label for="formPassword">Mots de Passe:</label>
                        <input type="password" id="formPassword" name="formPassword" placeholder="abc123">
                        <span class="error-message" id="formPasswordError"></span>
                    </div>
                    <br>
                    <div class="formCheckbox">
                        <label for="formCheckbox">Nouvelles de films:</label>
                        <input type="Checkbox" id="formCheckboxMovie" name="formCheckboxMovie">
                        <label for="formCheckbox">Nouvelles de romans:</label>
                        <input type="Checkbox" id="formCheckboxNovel" name="formCheckboxNovel">
                    </div>
                    <br>
                    <div class="formButtons">
                        <input id="submitButton" type="Submit">
                        <input id="resetButton" type="Reset">
                        <br>
                </form>
            </div>
        </div>
    </section>

    <div id="contactPageBottomImage"></div>
    <div id="contactPageBottomImageFade"></div>

    <footer>
        <div class="menuItemsFooter">
            <div class="menuItemsItems">
                <a href="index.html">Accueil</a>
                <a href="harryCharacters.html">Personnages</a>
                <a href="harryBooks.html">Livres</a>
                <a href="harryUpcoming.html">À venir</a>
            </div>
        </div>
    </footer>

    <script src="harryUpcoming.js"></script>
</body>

</html>
